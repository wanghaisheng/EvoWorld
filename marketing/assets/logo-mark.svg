<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">EvoWorld logo mark</title>
  <desc id="desc">A glowing evolutionary seed with gene rings for EvoWorld marketing.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#dffcff"/>
      <stop offset="42%" stop-color="#5cf6d1"/>
      <stop offset="72%" stop-color="#2b8cff"/>
      <stop offset="100%" stop-color="#07182d"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7fffe3"/>
      <stop offset="52%" stop-color="#3aa8ff"/>
      <stop offset="100%" stop-color="#f9c74f"/>
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.16 0 0 0 0 0.92 0 0 0 0 0.84 0 0 0 .75 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#07111f"/>
  <circle cx="256" cy="256" r="164" fill="url(#core)" filter="url(#glow)"/>
  <path d="M138 278c72-132 164-132 236 0" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>
  <path d="M144 234c80 112 144 112 224 0" fill="none" stroke="#0b1f36" stroke-width="20" stroke-linecap="round" opacity=".72"/>
  <path d="M178 314c54-42 102-42 156 0" fill="none" stroke="#f9c74f" stroke-width="20" stroke-linecap="round"/>
  <g fill="#eaffff">
    <circle cx="188" cy="230" r="16"/>
    <circle cx="256" cy="202" r="16"/>
    <circle cx="324" cy="230" r="16"/>
    <circle cx="212" cy="324" r="13"/>
    <circle cx="300" cy="324" r="13"/>
  </g>
</svg>
